<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal</title>
<style>
body{background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;margin:0}
.card{background:#1e293b;padding:30px;border-radius:20px;width:350px;border:1px solid #334155;text-align:center}
input{width:100%;padding:16px;border-radius:12px;background:#020617;color:white;font-size:26px;letter-spacing:8px;text-align:center;border:2px solid #22c55e;box-sizing:border-box;outline:none}
button{width:100%;padding:15px;background:#22c55e;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:15px;color:black}
#msg{margin-top:15px;padding:12px;border-radius:10px;display:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>NIALIKE GO TECH</h2>
<input id="pin" type="password" placeholder="••••••" maxlength="6">
<button type="button" onclick="checkPin()">INGIA PORTAL</button>
<div id="msg"></div>
<p style="color:#64748b;font-size:11px;margin-top:15px">PIN: 123456=Admin | 111111=Staff | 000000=Mteja</p>
</div>

<script>
function checkPin(){
  var pin = document.getElementById('pin').value.trim();
  var msg = document.getElementById('msg');
  
  // Reset
  msg.style.display = 'block';
  
  if(pin === ''){
    msg.style.background = '#7f1d1d';
    msg.style.color = '#fca5a5';
    msg.textContent = 'Ingiza PIN kwanza!';
    return;
  }
  
  // CHECK - Hapa ndipo ilikuwa inagoma
  if(pin === '123456'){
    msg.style.background = '#14532d';
    msg.style.color = '#86efac';
    msg.textContent = 'Karibu ADMIN! Inaelekeza...';
    localStorage.setItem('nialike_role','admin');
    localStorage.setItem('nialike_logged','true');
    setTimeout(function(){ window.location.href='admin.html'; }, 800);
  } 
  else if(pin === '111111'){
    msg.style.background = '#14532d';
    msg.style.color = '#86efac';
    msg.textContent = 'Karibu STAFF!';
    localStorage.setItem('nialike_role','staff');
    localStorage.setItem('nialike_logged','true');
    setTimeout(function(){ window.location.href='index.html'; }, 800);
  }
  else if(pin === '000000'){
    msg.style.background = '#14532d';
    msg.style.color = '#86efac';
    msg.textContent = 'Karibu MTEJA!';
    localStorage.setItem('nialike_role','mteja');
    localStorage.setItem('nialike_logged','true');
    setTimeout(function(){ window.location.href='index.html'; }, 800);
  }
  else {
    msg.style.background = '#7f1d1d';
    msg.style.color = '#fca5a5';
    msg.textContent = 'PIN sio sahihi! Jaribu 123456';
  }
}

// Bonyeza ENTER pia ifanye kazi
document.getElementById('pin').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ checkPin(); }
});
</script>
</body>
</html>
