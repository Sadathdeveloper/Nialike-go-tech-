<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nialike Go Tech</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding-top:70px;min-height:100vh}
.wrap{width:92%;max-width:320px;text-align:center}
h1{font-size:22px;font-weight:800}
h1 span{color:#c6a52d}
.sub{margin-top:8px;font-size:11px;opacity:.6;line-height:1.4}
.box{margin-top:18px;background:#151515;border-radius:12px;padding:14px;border:1px solid #222}
input{width:100%;background:transparent;border:none;text-align:center;font-size:18px;letter-spacing:8px;color:#fff;outline:none}
.btn{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:none;background:#1a5c2e;color:#7fb08d;font-weight:700;font-size:14px}
.btn.on{background:#16a34a;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Nialike <span>Go Tech</span></h1>
  <div class="sub">Ingiza PIN yako<br>Admin &nbsp; Msimamizi wa Mlango &nbsp; Mteja</div>
  <div class="box"><input id="pin" type="password" placeholder="••••" maxlength="12" autofocus></div>
  <button id="btn" class="btn">Ingia</button>
</div>
<script>
// Zima sw ya zamani
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()))}
// Zuia Hitilafu
const _alert=window.alert; window.alert=function(m){ if(String(m).includes('Hitilafu')) return; return _alert.apply(this,arguments) }

const PIN='Nialike2026';
const pin=document.getElementById('pin'), btn=document.getElementById('btn');
pin.addEventListener('input',()=>{ if(pin.value) btn.classList.add('on'); else btn.classList.remove('on') });

function goAdmin(){
  // Hizi ndizo moyo wa system unazitafuta
  localStorage.setItem('ngt_tok','admin-ok');
  localStorage.setItem('ngt_role','admin');
  localStorage.setItem('nialike_role','admin');
  localStorage.setItem('nialike_logged','true');
  localStorage.setItem('isAdmin','true');
  localStorage.setItem('admin','true');
  sessionStorage.setItem('isAdmin','true');
  // Sasa enda moyoni, sio home ya wateja
  location.href='/#admin';
}

btn.onclick=()=>{
  if(pin.value.trim()===PIN){ goAdmin(); }
  else { pin.value=''; btn.classList.remove('on'); }
};
pin.addEventListener('keydown',e=>{ if(e.key==='Enter' && pin.value.trim()===PIN) goAdmin() });
</script>
</body>
</html>
