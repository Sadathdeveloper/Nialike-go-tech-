<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1209">
<title>Mwaliko · Invitation</title>
<style>
:root{--g:#10b56e;--gold:#e0a92e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:inherit;margin:0;padding:0}
body{font:15px/1.5 system-ui,sans-serif;background:#0a1209;color:#dfeae3;text-align:center;padding:16px}
.w{max-width:380px;margin:auto}
.cd{width:100%;border-radius:14px;margin-bottom:14px;display:block}
h1{color:#fff;font-size:1.5rem;margin:6px 0}.m{color:#7fa892;font-size:.9rem}
.qr{background:#fff;border-radius:14px;padding:12px;margin:16px 0}.qr img{width:100%;display:block}
.qr p{color:#111;font-size:.7rem;word-break:break-all;margin-top:6px}
.b{display:block;width:100%;background:#0f7a4a;color:#fff;border:0;border-radius:10px;padding:12px;font:600 .9rem inherit;margin:8px 0;text-decoration:none}
.b.o{background:none;border:1px solid rgba(16,181,110,.3);color:#7fa892}
.eb{color:var(--gold);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="w" id="w"></div>
<script src="js/config.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/card.js"></script>
<script src="js/invite.js"></script>
</body>
</html>
